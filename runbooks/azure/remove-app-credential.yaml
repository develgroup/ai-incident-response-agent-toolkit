cloud: azure
runbook: remove-app-credential
phase: contain

action: |
  Remove a specific password / key / federated credential from a service
  principal or app registration. Removes the attacker's persistence
  without disabling the SPN entirely.

command: |
  # Password credential:
  POST https://graph.microsoft.com/v1.0/applications/${app_object_id}/removePassword
  Body: { "keyId": "${credential_id}" }

  # Federated identity credential:
  DELETE https://graph.microsoft.com/v1.0/applications/${app_object_id}/federatedIdentityCredentials/${credential_id}

  # CLI equivalent (password):
  az ad app credential delete --id ${app_object_id} --key-id ${credential_id}

blast_radius: |
  Workloads authenticating with this credential will start failing
  immediately. Other credentials on the same app remain valid.

rollback: |
  Generate a fresh credential through the normal admin workflow — never
  restore the removed value (it is assumed compromised).
